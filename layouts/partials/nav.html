<header class="masthead">
  <nav class="masthead__inner" aria-label="Main">
    <a class="site-name" href="{{ "/" | relURL }}">{{ site.Params.author }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
      <span class="visually-hidden">Menu</span>
      <svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <ul class="site-menu" id="site-menu">
      {{- range site.Menus.main }}
      <li><a href="{{ .URL | relURL }}"{{ if eq (.URL | relURL) $.RelPermalink }} aria-current="page"{{ end }}{{ if strings.HasSuffix .URL ".pdf" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
